name: Quality and integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clouder-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -c requirements.lock -e '.[dev]'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: make check
      - run: make test
      - run: python scripts/configure.py && docker compose config --quiet

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clouder
          POSTGRES_DB: clouder_test
          POSTGRES_PASSWORD: test-only-local-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouder -d clouder_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clouder:test-only-local-ci@localhost:5432/clouder_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: pytest -m 'not docker'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: sh scripts/pull-images.sh
      - run: CLOUDER_TEST_DOCKER=1 pytest tests/test_docker_integration.py -v
      - run: docker build -t clouder-ci .
      - run: python scripts/configure.py && python scripts/compose_smoke.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: pip install -c requirements.lock -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
